/* Layout: uma coluna central para usar no celular, com menu lateral aberto pelo botão de 3 linhas. */

  --bg: #000000;
  --panel: #07110a;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }

h1 { font-size: 24px; color: var(--neon); }
h2 { font-size: 18px; color: var(--neon); }
h3 { font-size: 15px; }
p { margin: 0; }
a { color: var(--neon); }
.muted { color: var(--muted); font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

#brand { font: 700 18px var(--display); color: var(--neon); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.icon-btn { flex: none; width: 42px; height: 42px; background: var(--panel); border: 1px solid var(--line); color: var(--neon); font-size: 20px; line-height: 1; cursor: pointer; position: relative; }

#drawer-shade { position: fixed; inset: 0; background: rgba(0, 0, 0, .7); z-index: 9; }

.product { display: flex; flex-direction: column; min-width: 0; background: #000; border: 1px solid var(--line); }

.product .pic { width: 100%; max-width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: grid; place-items: center; background: var(--panel-2); color: var(--neon-dim); font: 700 44px var(--display); }

.photo-field { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.photo-field .thumb { width: 88px; height: 88px; font-size: 13px; font-family: var(--body); font-weight: 500; color: var(--muted); text-align: center; }
.photo-pick { position: relative; overflow: hidden; }
.photo-pick input { position: absolute; inset: 0; min-height: 0; opacity: 0; cursor: pointer; font-size: 100px; }
.err { color: var(--alert); font-size: 14px; font-weight: 700; }
.pix-key { padding: 10px; background: #000; border: 1px dashed var(--neon-dim); font-weight: 700; overflow-wrap: anywhere; user-select: all; }
#qr { justify-self: center; background: #fff; padding: 10px; line-height: 0; }
#qr img, #qr canvas { width: 190px; height: 190px; display: block; }
.note { border-left: 3px solid var(--neon); padding-left: 10px; color: var(--muted); font-size: 13px; }
#modal-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .78); overflow: auto; padding: 16px; display: flex; align-items: flex-start; justify-content: center; }
#modal { width: min(520px, 100%); margin-block: auto; background: var(--panel); border: 1px solid var(--neon); padding: 16px; display: grid; gap: 12px; }
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); z-index: 30; background: var(--neon); color: #000; padding: 9px 15px; font-weight: 700; max-width: calc(100vw - 32px); text-align: center; }
#login { min-height: 100vh; display: grid; place-items: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#login .box { width: min(400px, 100%); display: grid; gap: 16px; }
#login h1 { font-size: 38px; text-shadow: 0 0 22px rgba(57, 255, 20, .45); }
.demo-logins { display: grid; gap: 8px; }
@media (prefers-reduced-motion: no-preference) { #drawer { animation: slide .16s ease-out; } @keyframes slide { from { transform: translateX(-24px); opacity: .4; } } }
</style>

function friendlyError(e) {

  const map = {

/* ---------- Pix copia e cola ---------- */
function crc16(s) {
  let crc = 0xffff;
  for (let i = 0; i < s.length; i++) {
    crc ^= s.charCodeAt(i) << 8;
    for (let b = 0; b < 8; b++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;
  }
  return crc.toString(16).toUpperCase().padStart(4, "0");
}
const asciiUpper = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9 ]/g, "").toUpperCase().trim();
function pixCode({ key, name, city, cents }) {
  const f = (id, v) => id + String(v.length).padStart(2, "0") + v;
  const account = f("00", "br.gov.bcb.pix") + f("01", String(key).trim());
  let p = f("00", "01") + f("26", account) + f("52", "0000") + f("53", "986");
  if (cents > 0) p += f("54", (cents / 100).toFixed(2));
  p += f("58", "BR") + f("59", asciiUpper(name).slice(0, 25) || "RECEBEDOR") + f("60", asciiUpper(city).slice(0, 15) || "BRASIL") + f("62", f("05", "***")) + "6304";
  return p + crc16(p);
}

  const now = Date.now(), day = 86400000;
  const mk = (id, name, price, resale, cost, stock, min) => [id, name, price, resale, cost, stock, min];

  d.sales.s2 = { id: "s2", at: now - 2 * day, kind: "revenda", resellerId: "r1", items: [item("p3", 2, 9490)], total: 2 * 9490, canceled: false, createdBy: "r1" };
  d.sales.s3 = { id: "s3", at: now - 1 * day, kind: "direta", customer: "Cliente balcão", items: [item("p1", 2, 8990)], total: 2 * 8990, canceled: false, createdBy: "owner" };
  d.payments.g1 = { id: "g1", at: now - 3 * day, confirmedAt: now - 3 * day, resellerId: "r1", amount: 15000, status: "confirmado", summary: "Pagamento parcial de exemplo" };
  return { data: d, logins: { ana: { pass: "1234", role: "reseller", uid: "r1" } } };
}
function createDemoStore() {
  const KEY = "prazo-certo-demo-v1";
  let db = null, session = null, cb = () => {};
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) { /* segue sem dados salvos */ }
  if (!db || !db.data) db = demoSeed();
  const addMuriel = () => {
    delete db.logins.dono;
    ["shipments", "supplierInfo"].forEach((c) => { if (!db.data[c]) db.data[c] = {}; });
    db.logins.vorcaro = { hash: "", role: "supplier", uid: "supplier" };
    if (db.data.settings.main && db.data.settings.main.supplierName === "Fornecedor exemplo") db.data.settings.main.supplierName = "Vorcaro";
    db.logins.ptk = { hash: "", role: "owner", uid: "owner" };
    if (db.logins.muriel) return;
    db.logins.muriel = { hash: "", role: "reseller", uid: "r-muriel" };
    db.data.resellers["r-muriel"] = { id: "r-muriel", name: "Muriel", phone: "", username: "muriel", active: true };
  };
  addMuriel();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* sem armazenamento */ } };
  const emit = () => { save(); cb(session, db.data); };
  return {
    mode: "demo",
    start(fn) { cb = fn; cb(null, db.data); },
    async login(user, pass) {
      const l = db.logins[String(user).trim().toLowerCase()];
      let ok = !!l && l.pass === pass;
      if (l && l.hash) {
        const enc = new TextEncoder(), name = String(user).trim().toLowerCase();
        const key = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
        const bytes = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode(`prazo-certo-${name}`), iterations: 300000 }, key, 256);
        ok = [...new Uint8Array(bytes)].map((b) => b.toString(16).padStart(2, "0")).join("") === l.hash;
      }
      if (!ok) throw userError("Usuário ou senha incorretos.");
      if (l.role === "reseller" && !db.data.resellers[l.uid]?.active) throw userError("Esse acesso foi desativado.");
      session = { role: l.role, uid: l.uid };
      cb(session, db.data);
    },
    async logout() { session = null; cb(null, db.data); },
    async set(col, id, doc) { db.data[col][id] = { ...(db.data[col][id] || {}), ...doc, id }; emit(); },
    async del(col, id) { delete db.data[col][id]; emit(); },
    async sell(sale) {
      for (const it of sale.items) if ((db.data.products[it.productId]?.stock ?? 0) < it.qty) throw userError(`Estoque insuficiente de ${it.name}.`);
      sale.items.forEach((it) => { db.data.products[it.productId].stock -= it.qty; });
      db.data.sales[sale.id] = sale;
      emit();
    },
    async cancelSale(id) {
      const s = db.data.sales[id];
      s.items.forEach((it) => { if (db.data.products[it.productId]) db.data.products[it.productId].stock += it.qty; });
      s.canceled = true;
      emit();
    },
    async addPurchase(purchase) {
      purchase.items.forEach((it) => {
        const p = db.data.products[it.productId], c = db.data.productCosts[it.productId];
        const stock = Math.max(p.stock, 0);
        c.cost = Math.round((stock * (c.cost || 0) + it.qty * it.cost) / (stock + it.qty));
        p.stock += it.qty;
      });
      db.data.supplierPurchases[purchase.id] = purchase;
      emit();
    },
    async removePurchase(id) {
      const pu = db.data.supplierPurchases[id];
      pu.items.forEach((it) => { if (db.data.products[it.productId]) db.data.products[it.productId].stock = Math.max(0, db.data.products[it.productId].stock - it.qty); });
      delete db.data.supplierPurchases[id];
      emit();
    },
    async createReseller({ name, phone, username, password }) {
      const u = username.trim().toLowerCase();
      if (db.logins[u]) throw userError("Esse usuário já existe. Escolha outro.");
      const id = uid();
      db.logins[u] = { pass: password, role: "reseller", uid: id };
      db.data.resellers[id] = { id, name, phone, username: u, active: true };
      emit();
    },
    async reset() { db = demoSeed(); addMuriel(); session = null; save(); cb(null, db.data); }
  };
}

function loadScript(src) {
  return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
}
function createFirebaseStore(cfg) {
  const emailOf = (u) => `${String(u).trim().toLowerCase()}@${EMAIL_DOMAIN}`;
  const OWNER_EMAIL = emailOf(OWNER_USER);
  let fs, auth, session = null, cb = () => {}, unsubs = [];

  const clear = () => { unsubs.forEach((u) => u()); unsubs = []; COLLECTIONS.forEach((c) => { data[c] = {}; }); };
  const watch = (col, query) => {
    unsubs.push(query.onSnapshot((snap) => {
      snap.docChanges().forEach((ch) => {
        if (ch.type === "removed") delete data[col][ch.doc.id];
        else data[col][ch.doc.id] = { ...ch.doc.data(), id: ch.doc.id };
      });
      cb(session, data);
    }, () => toast("Sem acesso aos dados agora. Tente entrar de novo.")));
  };
  return {
    mode: "real",
    async start(fn) {
      cb = fn;
      const base = "https://www.gstatic.com/firebasejs/10.14.1/";
      await loadScript(base + "firebase-app-compat.js");
      await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]);
      firebase.initializeApp(cfg);
      auth = firebase.auth();
      fs = firebase.firestore();
      auth.onAuthStateChanged(async (user) => {
        clear();
        if (!user) { session = null; cb(null, data); return; }
        if (user.email === OWNER_EMAIL) {
          session = { role: "owner", uid: user.uid };
          COLLECTIONS.forEach((c) => watch(c, fs.collection(c)));
        } else if (user.email === emailOf(SUPPLIER_USER)) {
          session = { role: "supplier", uid: user.uid };
          ["settings", "supplierPurchases", "supplierPayments", "shipments", "supplierInfo"].forEach((c) => watch(c, fs.collection(c)));
        } else {
          const me = await fs.collection("resellers").doc(user.uid).get().catch(() => null);
          if (!me || !me.exists || !me.data().active) { await auth.signOut(); toast("Esse acesso foi desativado."); return; }
          session = { role: "reseller", uid: user.uid };
          data.resellers[user.uid] = { ...me.data(), id: user.uid };
          watch("settings", fs.collection("settings"));
          watch("products", fs.collection("products"));
          watch("sales", fs.collection("sales").where("resellerId", "==", user.uid));
          watch("payments", fs.collection("payments").where("resellerId", "==", user.uid));
        }
        cb(session, data);
      });
    },
    async login(user, pass) { await auth.signInWithEmailAndPassword(emailOf(user), pass); },
    async createOwner(pass) { await auth.createUserWithEmailAndPassword(OWNER_EMAIL, pass); },
    async createSupplier(pass) {
      const second = firebase.apps.find((a) => a.name === "criar-login") || firebase.initializeApp(cfg, "criar-login");
      await second.auth().createUserWithEmailAndPassword(emailOf(SUPPLIER_USER), pass);
      await second.auth().signOut();
    },
    async logout() { await auth.signOut(); },
    async set(col, id, doc) { await fs.collection(col).doc(id).set(doc, { merge: true }); },
    async del(col, id) { await fs.collection(col).doc(id).delete(); },
    async sell(sale) {
      await fs.runTransaction(async (tx) => {
        const refs = sale.items.map((it) => fs.collection("products").doc(it.productId));
        const docs = await Promise.all(refs.map((r) => tx.get(r)));
        docs.forEach((d, i) => { if (!d.exists || d.data().stock < sale.items[i].qty) throw userError(`Estoque insuficiente de ${sale.items[i].name}.`); });
        docs.forEach((d, i) => tx.update(refs[i], { stock: d.data().stock - sale.items[i].qty }));
        tx.set(fs.collection("sales").doc(sale.id), sale);
      });
    },
    async cancelSale(id) {
      await fs.runTransaction(async (tx) => {
        const saleRef = fs.collection("sales").doc(id), sale = (await tx.get(saleRef)).data();
        const refs = sale.items.map((it) => fs.collection("products").doc(it.productId));
        const docs = await Promise.all(refs.map((r) => tx.get(r)));
        docs.forEach((d, i) => { if (d.exists) tx.update(refs[i], { stock: d.data().stock + sale.items[i].qty }); });
        tx.update(saleRef, { canceled: true });
      });
    },
    async addPurchase(purchase) {
      await fs.runTransaction(async (tx) => {
        const pRefs = purchase.items.map((it) => fs.collection("products").doc(it.productId));
        const cRefs = purchase.items.map((it) => fs.collection("productCosts").doc(it.productId));
        const ps = await Promise.all(pRefs.map((r) => tx.get(r)));
        const cs = await Promise.all(cRefs.map((r) => tx.get(r)));
        purchase.items.forEach((it, i) => {
          const stock = Math.max(ps[i].data().stock, 0), cost = cs[i].exists ? cs[i].data().cost : 0;
          tx.update(pRefs[i], { stock: ps[i].data().stock + it.qty });
          tx.set(cRefs[i], { cost: Math.round((stock * cost + it.qty * it.cost) / (stock + it.qty)) }, { merge: true });
        });
        tx.set(fs.collection("supplierPurchases").doc(purchase.id), purchase);
      });
    },
    async removePurchase(id) {
      await fs.runTransaction(async (tx) => {
        const ref = fs.collection("supplierPurchases").doc(id), pu = (await tx.get(ref)).data();
        const refs = pu.items.map((it) => fs.collection("products").doc(it.productId));
        const docs = await Promise.all(refs.map((r) => tx.get(r)));
        docs.forEach((d, i) => { if (d.exists) tx.update(refs[i], { stock: Math.max(0, d.data().stock - pu.items[i].qty) }); });
        tx.delete(ref);
      });
    },
    async createReseller({ name, phone, username, password }) {
      /* Uma segunda conexão cria o login sem tirar o dono da conta dele */
      const second = firebase.apps.find((a) => a.name === "criar-login") || firebase.initializeApp(cfg, "criar-login");
      const u = username.trim().toLowerCase();
      const made = await second.auth().createUserWithEmailAndPassword(emailOf(u), password);
      await fs.collection("resellers").doc(made.user.uid).set({ name, phone, username: u, active: true });
      await second.auth().signOut();
    }
  };
}

const store = FIREBASE_CONFIG ? createFirebaseStore(FIREBASE_CONFIG) : createDemoStore();
const state = { session: null, data: Object.fromEntries(COLLECTIONS.map((c) => [c, {}])), view: "inicio", drawer: false, cart: {}, sellTo: "direta", customer: "", weekOffset: 0, resellerOpen: null, payAmount: null, pending: false };
const settings = () => state.data.settings.main || {};
const liveSales = () => values("sales").filter((s) => !s.canceled);
const costOf = (productId) => state.data.productCosts[productId]?.cost || 0;

function resellerBalance(id) {
  const bought = liveSales().filter((s) => s.resellerId === id).reduce((a, s) => a + s.total, 0);
  const paid = values("payments").filter((p) => p.resellerId === id && p.status === "confirmado").reduce((a, p) => a + p.amount, 0);
  return bought - paid;
}
const pendingPayments = (id) => values("payments").filter((p) => p.status === "pendente" && (!id || p.resellerId === id));
/* O que foi pago abate as compras mais antigas primeiro */
function openSales(id) {
  let paid = values("payments").filter((p) => p.resellerId === id && p.status === "confirmado").reduce((a, p) => a + p.amount, 0);
  const open = [];
  liveSales().filter((s) => s.resellerId === id).sort((a, b) => a.at - b.at).forEach((s) => {
    const used = Math.min(paid, s.total);
    paid -= used;
    if (s.total - used > 0) open.push({ sale: s, remaining: s.total - used });
  });
  return open;
}
const supplierDebt = () => values("supplierPurchases").reduce((a, p) => a + p.total, 0) - values("supplierPayments").reduce((a, p) => a + p.amount, 0);
const receivableTotal = () => values("resellers").reduce((a, r) => a + Math.max(resellerBalance(r.id), 0), 0);
function weekRange(offset) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset * 7);
  const end = new Date(d); end.setDate(d.getDate() + 7);
  return [d.getTime(), end.getTime()];
}
function weekReport(offset) {
  const [from, to] = weekRange(offset), inW = (t) => t >= from && t < to;
  const sales = liveSales().filter((s) => inW(s.at));
  const soldDirect = sales.filter((s) => s.kind === "direta").reduce((a, s) => a + s.total, 0);
  const soldReseller = sales.filter((s) => s.kind === "revenda").reduce((a, s) => a + s.total, 0);
  const receivedResellers = values("payments").filter((p) => p.status === "confirmado" && inW(p.confirmedAt || p.at)).reduce((a, p) => a + p.amount, 0);
  const received = soldDirect + receivedResellers;
  const costSold = sales.reduce((a, s) => a + s.items.reduce((b, it) => b + it.qty * costOf(it.productId), 0), 0);
  const paidSupplier = values("supplierPayments").filter((p) => inW(p.at)).reduce((a, p) => a + p.amount, 0);
  const debt = supplierDebt();
  const suggest = Math.max(0, Math.min(costSold - paidSupplier, received - paidSupplier, debt));
  return { from, to, sales, soldDirect, soldReseller, receivedResellers, received, costSold, paidSupplier, debt, suggest, profit: soldDirect + soldReseller - costSold };
}

function shrinkPhoto(file) {
  return new Promise((ok, bad) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 500 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(userError("Não consegui abrir essa imagem. Tente uma foto em JPG ou PNG.")); };
    img.src = url;
  });
}

    <a id="wa-link" class="btn wide" target="_blank" rel="noopener" href="#" data-act="wa-send">Já paguei: enviar no WhatsApp</a>` : `<p class="empty">O dono ainda não cadastrou a chave Pix.</p>`}
  </section>` : ""}`;

function payMessage(cents) {
  const me = currentMe(), open = openSales(state.session.uid);
  let left = cents;
  const lines = [];
  open.forEach((o) => {
    if (left <= 0) return;
    const used = Math.min(left, o.remaining);
    left -= used;
    lines.push(`• ${dateText(o.sale.at)}: ${o.sale.items.map((i) => `${i.qty}x ${i.name}`).join(", ")} (${money(used)}${used < o.remaining ? ", parcial" : ""})`);
  });
  return { lines, text: `Olá! Aqui é ${me?.name || "seu revendedor"}.\nPaguei ${money(cents)} por Pix.\n\nO que estou pagando:\n${lines.join("\n")}\n\nSegue o comprovante.` };
}
function afterPayRender() {
  const input = $("pay-amount");
  if (!input) return;
  const cents = state.payAmount || 0, s = settings();
  const link = $("wa-link");
  if (link) {
    const digits = String(s.whatsapp || "").replace(/\D/g, "");
    const phone = digits && !digits.startsWith("55") ? `55${digits}` : digits;
    link.href = `https://wa.me/${phone}?text=${encodeURIComponent(payMessage(cents).text)}`;
  }
  const qr = $("qr");
  if (qr) {
    qr.innerHTML = "";
    if (window.QRCode && cents > 0) new QRCode(qr, { text: pixCode({ key: s.pixKey, name: s.pixName, city: s.pixCity, cents }), width: 190, height: 190, correctLevel: QRCode.CorrectLevel.M });
    else qr.hidden = true;
  }
}

    <label>Produto<select name="productId" id="pl-product" data-change="pl-product">${list.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select></label>
    <div class="two"><label>Quantidade<input name="qty" inputmode="numeric" required></label><label>Custo por unidade (R$)<input name="cost" id="pl-cost" inputmode="decimal" value="${moneyInput(costOf(list[0].id))}" required></label></div>
    <div class="err" id="form-err" hidden></div>
    <button class="btn ghost" type="submit">Adicionar à entrada</button>
  </form>
  ${purchaseDraft.lines.length ? `<div class="list">${purchaseDraft.lines.map((l, i) => `<div class="item"><div>${l.qty}x ${esc(l.name)}<br><span class="muted">${money(l.cost)} cada</span></div><div class="right"><div class="money">${money(l.qty * l.cost)}</div><button class="btn small ghost" type="button" data-act="pl-remove" data-i="${i}">Tirar</button></div></div>`).join("")}</div><div class="total"><span>Total</span><span>${money(total)}</span></div>` : ""}
  <div class="row"><button class="btn" type="button" data-act="purchase-save" ${purchaseDraft.lines.length ? "" : "disabled"}>Lançar entrada</button><button class="btn ghost" type="button" data-act="close">Voltar</button></div>`;
}
function amountForm(title, form, amount, extra = "") {
  return `<h2>${esc(title)}</h2><form data-form="${form}"${extra}>
    <label>Valor (R$)<input name="amount" inputmode="decimal" value="${amount ? moneyInput(amount) : ""}" required></label>
    <label>Observação (opcional)<input name="note"></label>
    <div class="err" id="form-err" hidden></div>
    <div class="row"><button class="btn" type="submit">Salvar</button><button class="btn ghost" type="button" data-act="close">Voltar</button></div>
  </form>`;
}
function formError(text) { const e = $("form-err"); if (e) { e.textContent = text; e.hidden = false; } else toast(text); }
const intOf = (v, fallback = 0) => { const n = parseInt(String(v).replace(/\D/g, ""), 10); return Number.isFinite(n) ? n : fallback; };

/* ---------- Ações ---------- */
async function guard(fn) { try { await fn(); } catch (e) { toast(friendlyError(e)); } }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Copiado"); }
  catch (e) { openModal(`<h2>Copie abaixo</h2><div class="pix-key">${esc(text)}</div><button class="btn" type="button" data-act="close">Fechar</button>`); }
}
const actions = {
  drawer() { state.drawer = true; render(); },
  "drawer-close"() { state.drawer = false; render(); },
  go(el) { state.view = el.dataset.v; state.drawer = false; state.cart = {}; state.resellerOpen = null; state.payAmount = null; render(); window.scrollTo(0, 0); },
  close() { closeModal(); },
  yes() { const fn = pendingYes; pendingYes = null; closeModal(); if (fn) guard(fn); },
  logout() { state.drawer = false; state.cart = {}; state.view = "inicio"; guard(() => store.logout()); },
  "demo-login"(el) { state.view = el.dataset.u === "dono" ? "inicio" : "comprar"; guard(() => store.login(el.dataset.u, "1234")); },
  "demo-reset"() { confirmBox("Voltar aos dados de exemplo e apagar o que você testou?", "Restaurar", async () => { state.drawer = false; await store.reset(); }); },
  "first-owner"() {
    openModal(`<h2>Criar a senha do dono</h2><p class="muted">Faça isso só uma vez. Depois entre com o usuário "ptk".</p><form data-form="first-owner"><label>Senha (mínimo 6 caracteres)<input name="pass" type="password" minlength="6" required></label><div class="err" id="form-err" hidden></div><div class="row"><button class="btn" type="submit">Criar</button><button class="btn ghost" type="button" data-act="close">Voltar</button></div></form>`);
  },
  cart(el) {
    const id = el.dataset.id, p = state.data.products[id], next = (state.cart[id] || 0) + Number(el.dataset.d);
    if (next < 0) return;
    if (p && next > p.stock) return toast(`Só há ${p.stock} no estoque.`);
    state.cart[id] = next;
    render();
  },
  sell() {
    const direct = state.sellTo === "direta";
    const items = cartItems((p) => (direct ? p.price : p.resalePrice));
    if (!items.length) return;
    const sale = { id: uid(), at: Date.now(), kind: direct ? "direta" : "revenda", items, total: cartTotal(items), canceled: false, createdBy: "owner" };
    if (direct) { sale.customer = state.customer.trim(); sale.resellerId = null; } else sale.resellerId = state.sellTo;
    guard(async () => { await store.sell(sale); state.cart = {}; state.customer = ""; toast("Venda registrada"); render(); });
  },
  "reseller-buy"() {
    const items = cartItems((p) => p.resalePrice);
    if (!items.length) return;
    const total = cartTotal(items);
    confirmBox(`Confirmar compra a prazo de ${money(total)}?`, "Confirmar", async () => {
      await store.sell({ id: uid(), at: Date.now(), kind: "revenda", resellerId: state.session.uid, items, total, canceled: false, createdBy: state.session.uid });
      state.cart = {};
      state.view = "pagar";
      state.payAmount = null;
      toast("Compra marcada na sua conta");
      render();
    });
  },
  "sale-cancel"(el) { confirmBox("Cancelar esta venda? Os produtos voltam para o estoque e o saldo é corrigido.", "Cancelar venda", () => store.cancelSale(el.dataset.id)); },
  "pay-confirm"(el) { guard(async () => { await store.set("payments", el.dataset.id, { status: "confirmado", confirmedAt: Date.now() }); toast("Pagamento confirmado e abatido do saldo"); }); },
  "pay-reject"(el) { confirmBox("Recusar este pagamento? O saldo do revendedor continua igual.", "Recusar", () => store.set("payments", el.dataset.id, { status: "recusado" })); },
  "reseller-new"() {
    openModal(`<h2>Novo revendedor</h2><form data-form="reseller"><label>Nome<input name="name" required></label><label>WhatsApp (opcional)<input name="phone" inputmode="tel"></label><div class="two"><label>Usuário de acesso<input name="username" autocapitalize="none" pattern="[A-Za-z0-9._\\-]+" title="Use letras e números, sem espaços" required></label><label>Senha (mínimo 6)<input name="password" minlength="6" required></label></div><div class="err" id="form-err" hidden></div><div class="row"><button class="btn" type="submit">Criar acesso</button><button class="btn ghost" type="button" data-act="close">Voltar</button></div></form>`);
  },
  "reseller-open"(el) { state.resellerOpen = el.dataset.id; render(); window.scrollTo(0, 0); },
  "reseller-close"() { state.resellerOpen = null; render(); },
  "reseller-toggle"(el) { const r = state.data.resellers[el.dataset.id]; guard(() => store.set("resellers", r.id, { active: !r.active })); },
  "manual-pay"(el) { openModal(amountForm("Registrar recebimento", "manual-pay", resellerBalance(el.dataset.id), ` data-id="${esc(el.dataset.id)}"`)); },
  "product-new"() { draftPhoto = ""; openModal(productForm(null)); },
  "product-edit"(el) { const p = state.data.products[el.dataset.id]; draftPhoto = photoOf(p); openModal(productForm(p)); },
  "photo-remove"() { draftPhoto = ""; $("photo-preview").innerHTML = photoFieldHtml(); },
  "product-del"(el) { const id = el.dataset.id; confirmBox("Apagar este produto? O histórico de vendas continua.", "Apagar", async () => { await store.del("products", id); await store.del("productCosts", id); }); },
  purchase() { purchaseDraft.lines = []; purchaseDraft.shipment = null; openModal(purchaseHtml()); },
  "ship-check"(el) {
    const s = state.data.shipments[el.dataset.id];
    openModal(`<h2>Conferir envio</h2><p><b>${esc(s.description)}</b></p><div class="total"><span>Valor informado</span><span>${money(s.total)}</span></div><p class="muted">Lance por produto para somar no estoque. Se confirmar só o valor, entra na dívida e o estoque não muda.</p><div class="row"><button class="btn" type="button" data-act="ship-lines" data-id="${esc(s.id)}">Lançar por produto</button><button class="btn ghost" type="button" data-act="ship-value" data-id="${esc(s.id)}">Confirmar só o valor</button><button class="btn ghost" type="button" data-act="ship-reject" data-id="${esc(s.id)}">Recusar</button><button class="btn ghost" type="button" data-act="close">Voltar</button></div>`);
  },
  "ship-lines"(el) { purchaseDraft.lines = []; purchaseDraft.shipment = el.dataset.id; openModal(purchaseHtml()); },
  "ship-value"(el) {
    const s = state.data.shipments[el.dataset.id];
    guard(async () => {
      await store.addPurchase({ id: uid(), at: Date.now(), items: [], total: s.total, note: s.description });
      await store.set("shipments", s.id, { status: "confirmado" });
      closeModal();
      toast("Envio confirmado e somado na dívida");
    });
  },
  "ship-reject"(el) { const id = el.dataset.id; closeModal(); guard(async () => { await store.set("shipments", id, { status: "recusado" }); toast("Envio recusado"); }); },
  "copy-sup"(el) { copyText(el.dataset.text === "key" ? (state.data.supplierInfo.main || {}).pixKey : supPixCode()); },
  "supplier-login"() { openModal(`<h2>Acesso do fornecedor</h2><form data-form="supplier-login"><label>Senha (mínimo 6 caracteres)<input name="pass" minlength="6" required></label><div class="err" id="form-err" hidden></div><div class="row"><button class="btn" type="submit">Criar</button><button class="btn ghost" type="button" data-act="close">Voltar</button></div></form>`); },
  "pl-remove"(el) { purchaseDraft.lines.splice(Number(el.dataset.i), 1); openModal(purchaseHtml()); },
  "purchase-save"() {
    const items = purchaseDraft.lines.map((l) => ({ ...l }));
    if (!items.length) return;
    guard(async () => {
      const ship = purchaseDraft.shipment && state.data.shipments[purchaseDraft.shipment];
      await store.addPurchase({ id: uid(), at: Date.now(), items, total: items.reduce((a, l) => a + l.qty * l.cost, 0), note: ship ? ship.description : "" });
      if (ship) await store.set("shipments", ship.id, { status: "confirmado" });
      purchaseDraft.lines = [];
      purchaseDraft.shipment = null;
      closeModal();
      toast("Entrada lançada: estoque e dívida atualizados");
    });
  },
  "purchase-del"(el) { confirmBox("Apagar esta entrada? O estoque e a dívida serão corrigidos.", "Apagar", () => store.removePurchase(el.dataset.id)); },
  "supplier-pay"(el) { openModal(supplierPayHtml(Number(el.dataset.amount) || 0)); renderSupQr(); },
  "supplier-pay-del"(el) { confirmBox("Apagar este pagamento? A dívida volta a aumentar.", "Apagar", () => store.del("supplierPayments", el.dataset.id)); },
  week(el) { state.weekOffset = Math.min(0, state.weekOffset + Number(el.dataset.d)); render(); },
  copy(el) {
    const s = settings();
    copyText(el.dataset.text === "key" ? s.pixKey : pixCode({ key: s.pixKey, name: s.pixName, city: s.pixCity, cents: state.payAmount || 0 }));
  },
  "wa-send"(el, ev) {
    const cents = state.payAmount || 0;
    const me = state.session.uid, pendTotal = pendingPayments(me).reduce((a, p) => a + p.amount, 0);
    if (cents <= 0 || cents > resellerBalance(me) - pendTotal) { ev.preventDefault(); return toast("Confira o valor do pagamento."); }
    const { lines } = payMessage(cents);
    /* Deixa o link abrir o WhatsApp e só depois atualiza a tela */
    setTimeout(() => guard(async () => {
      const id = uid();
      await store.set("payments", id, { at: Date.now(), resellerId: me, amount: cents, status: "pendente", summary: lines.join(" ").replace(/• /g, "") });
      state.payAmount = null;
      toast("Pagamento enviado para confirmação");
      render();
    }), 50);
    return "keep";
  }
};
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = actions[el.dataset.act];
  if (!act) return;
  const r = act(el, ev);
  if (el.tagName === "A" && r !== "keep") ev.preventDefault();
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { if ($("modal-wrap")) closeModal(); else if (state.drawer) { state.drawer = false; render(); } } });
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset.input === "pay-amount") {
    const v = parseMoney(el.value);
    state.payAmount = Number.isNaN(v) ? 0 : v;
    afterPayRender();
  }
  if (el.dataset.change === "customer") state.customer = el.value;
  if (el.dataset.input === "sup-amount") renderSupQr();
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset.change === "sell-to") { state.sellTo = el.value; el.blur(); state.pending = false; render(); }
  if (el.dataset.change === "photo" && el.files && el.files[0]) {
    shrinkPhoto(el.files[0]).then((data) => { draftPhoto = data; $("photo-preview").innerHTML = photoFieldHtml(); }).catch((e) => formError(friendlyError(e)));
  }
  if (el.dataset.change === "pl-product") { const c = $("pl-cost"); if (c) c.value = moneyInput(costOf(el.value)); }
});
const forms = {
  async login(d, form) {
    const err = $("login-err");
    err.hidden = true;
    try { await store.login(d.user, d.pass); }
    catch (e) { err.textContent = friendlyError(e); err.hidden = false; }
  },
  async "first-owner"(d) { await store.createOwner(d.pass); closeModal(); },
  async settings(d) {
    const { supPixKey, supPixName, supPixCity, ...main } = d;
    await store.set("settings", "main", main);
    await store.set("supplierInfo", "main", { pixKey: supPixKey.trim(), pixName: supPixName.trim(), pixCity: supPixCity.trim() });
    toast("Configurações salvas");
  },
  async shipment(d, form) {
    const total = parseMoney(d.total);
    if (!total || Number.isNaN(total)) return toast("Informe o valor total.");
    await store.set("shipments", uid(), { at: Date.now(), description: d.description.trim(), total, status: "pendente" });
    form.reset();
    toast("Envio mandado para conferência");
  },
  async "supplier-info"(d) { await store.set("supplierInfo", "main", { pixKey: d.pixKey.trim(), pixName: d.pixName.trim(), pixCity: d.pixCity.trim() }); toast("Chave Pix salva"); },
  async "supplier-login"(d) { await store.createSupplier(d.pass); closeModal(); toast("Acesso do fornecedor criado"); },
  async product(d, form) {
    const cost = parseMoney(d.cost), price = parseMoney(d.price), resalePrice = parseMoney(d.resalePrice);
    if ([cost, price, resalePrice].some(Number.isNaN)) return formError("Confira os valores em reais.");
    const id = form.dataset.id || uid();
    await store.set("products", id, { name: d.name.trim(), price, resalePrice, minStock: intOf(d.minStock), stock: intOf(d.stock), photo: draftPhoto });
    await store.set("productCosts", id, { cost });
    closeModal();
    toast("Produto salvo");
  },
  async "purchase-line"(d) {
    const qty = intOf(d.qty), cost = parseMoney(d.cost), p = state.data.products[d.productId];
    if (!qty || Number.isNaN(cost)) return formError("Informe a quantidade e o custo.");
    purchaseDraft.lines.push({ productId: d.productId, name: p.name, qty, cost });
    openModal(purchaseHtml());
  },
  async reseller(d) {
    await store.createReseller({ name: d.name.trim(), phone: d.phone.trim(), username: d.username, password: d.password });
    closeModal();
    openModal(`<h2>Acesso criado</h2><p>Mande para ${esc(d.name)}:</p><div class="pix-key">Usuário: ${esc(d.username.trim().toLowerCase())}<br>Senha: ${esc(d.password)}</div><button class="btn" type="button" data-act="close">Fechar</button>`);
  },
  async "manual-pay"(d, form) {
    const amount = parseMoney(d.amount);
    if (!amount || Number.isNaN(amount)) return formError("Informe o valor.");
    const now = Date.now();
    await store.set("payments", uid(), { at: now, confirmedAt: now, resellerId: form.dataset.id, amount, status: "confirmado", summary: d.note.trim() || "Registrado pelo dono" });
    closeModal();
    toast("Recebimento registrado");
  },
  async "supplier-pay"(d) {
    const amount = parseMoney(d.amount);
    if (!amount || Number.isNaN(amount)) return formError("Informe o valor.");
    await store.set("supplierPayments", uid(), { at: Date.now(), amount, note: d.note.trim() });
    closeModal();
    toast("Pagamento abatido da dívida");
  }
};
document.addEventListener("submit", async (ev) => {
  const form = ev.target, name = form.dataset.form;
  if (!name || !forms[name]) return;
  ev.preventDefault();
  const d = Object.fromEntries(new FormData(form).entries());
  try { await forms[name](d, form); }
  catch (e) { const t = friendlyError(e); if ($("form-err")) formError(t); else if (name !== "login") toast(t); }
});

Promise.resolve(store.start((session, data) => {
  const was = !!state.session;
  state.session = session;
  state.data = data;
  if (session && !was) { state.view = { owner: "inicio", supplier: "forn" }[session.role] || "comprar"; document.getElementById("root").innerHTML = ""; }
  if (!session && was) document.getElementById("root").innerHTML = "";
  render();
})).catch(() => { $("root").innerHTML = `<div id="login"><p class="err">Não consegui carregar o app. Confira a internet e abra de novo.</p></div>`; });
</script>

</body>
</html>
